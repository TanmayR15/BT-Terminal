<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="logo.jpg" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BT Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181A;
    --panel: #212327;
    --panel-edge: #3B3E42;
    --ink: #EDEDED;
    --ink-muted: #8F9296;
    --ink-dim: #C7CACD;
    --shadow: #000000;
    --maths: #4CDE6E;    --maths-tint: #123420;
    --physics: #FF5A36;  --physics-tint: #3A1810;
    --chemistry: #38B6FF; --chemistry-tint: #10283A;
  }
  * { box-sizing: border-box; image-rendering: pixelated; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: 'VT323', monospace;
    background-image:
      linear-gradient(var(--panel-edge) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-edge) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
    background-attachment: fixed;
  }
  .pixel { font-family: 'Press Start 2P', monospace; }
  .mono  { font-family: 'VT323', monospace; }
  #app { max-width: 720px; margin: 0 auto; padding: 28px 16px 60px; }

  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .backbtn {
    width: 38px; height: 38px; border: 3px solid var(--ink);
    background: var(--panel); color: var(--ink); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .backbtn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
  h1.pixel { font-size: 16px; margin: 0; cursor: pointer; line-height: 1.5; color: #F2F2F2; text-shadow: 3px 3px 0 var(--shadow); }
  .subtitle {  font-size: 18px; color: var(--ink-muted); margin-top: 6px; letter-spacing: 1px; position: relative; top: -3px; }
  .overall-stat { text-align: right; }
  .overall-pct.pixel { font-size: 20px; color: #F2F2F2; text-shadow: 3px 3px 0 var(--shadow); }
  .overall-frac {  font-size: 17px; color: var(--ink-dim); margin-top: 4px; position: relative; top: -3px; }

  .toolbar { display: flex; gap: 10px; margin: 16px 0 22px; flex-wrap: wrap; }
  .toolbtn {
    font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 10px 12px;
    border: 3px solid var(--ink); background: var(--panel); color: var(--ink);
    cursor: pointer; box-shadow: 4px 4px 0 var(--shadow);
  }
  .toolbtn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }

  .pixel-bar { display: flex; gap: 2px; }
  .pixel-bar-seg { flex: 1; background: var(--panel-edge); border: 2px solid var(--shadow); }

  .crumbs {  display: flex; flex-wrap: wrap; gap: 6px; font-size: 18px; color: var(--ink-muted); margin-bottom: 18px; align-items: center; position: relative; top: -3px; }
  .crumbs button { background: none; border: none; padding: 0; font: inherit; color: var(--ink-muted); cursor: pointer; }
  .crumbs button:hover:not(:disabled) { color: #F2F2F2; }
  .crumbs button:disabled { color: var(--ink); cursor: default; }
  .crumb-sep { color: var(--panel-edge); }

  .card {
    text-align: left; width: 100%; display: block;
    background: var(--panel); border: 3px solid var(--panel-edge);
    padding: 16px; cursor: pointer; font: inherit; color: inherit;
    box-shadow: 5px 5px 0 var(--shadow); margin-bottom: 2px;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--shadow); }
  .card:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--shadow); }
  .subject-strip { height: 8px; margin: -16px -16px 14px -16px; }
  .card-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .card-title.pixel { font-size: 12px; line-height: 1.6; }
  .card-title-sm.pixel { font-size: 10px; line-height: 1.6; }
  .card-sub {  font-size: 16px; color: var(--ink-muted); margin-bottom: 10px; position: relative; top: -3px; }
  .chapter-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .chapter-list-item {  font-size: 17px; color: var(--ink-muted); position: relative; top: -3px; }
  .stat {  font-size: 17px; color: var(--ink-dim); position: relative; top: -3px; }

  .stack { display: flex; flex-direction: column; gap: 16px; }

  .subject-title.pixel { font-size: 15px; }

  .chapter-total-box { background: var(--panel); border: 3px solid var(--panel-edge); padding: 18px; margin-bottom: 18px; box-shadow: 5px 5px 0 var(--shadow); }
  .exam-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; margin-bottom: 12px; font-size: 16px; color: var(--ink-dim); }
  .exam-sep { color: var(--panel-edge); }
  .exam-tag { font-size: 8px; padding: 4px 6px; border: 2px solid currentColor; letter-spacing: 0.5px; }
  .exam-tag.reduced { color: #E8A63C; }
  .exam-tag.removed { color: #FF5A5A; }
  .exam-arrow.up { color: var(--maths); }
  .exam-arrow.down { color: var(--physics); }
  .exam-note { color: var(--chemistry); cursor: help; }

  .ex-card { background: var(--panel); border: 3px solid var(--panel-edge); padding: 16px; box-shadow: 5px 5px 0 var(--shadow); }
  .pyq-card {
    background: transparent; border: 3px dashed var(--panel-edge); padding: 16px; margin-top: 14px;
  }
  .pyq-input { width: 60px; }
  .ex-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
  .ex-name.pixel { font-size: 11px; margin-bottom: 6px; display: block; }
  .ex-sub {  font-size: 15px; color: var(--ink-muted); position: relative; top: -3px; }
  .ex-controls { display: flex; align-items: center; gap: 8px; }
  .stepbtn {
    width: 34px; height: 34px; border: 3px solid var(--ink); font-family: 'Press Start 2P', monospace;
    cursor: pointer; font-size: 14px; box-shadow: 3px 3px 0 var(--shadow);
  }
  .stepbtn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .ex-input {
    width: 60px; text-align: center; font-family: 'VT323', monospace; font-size: 20px;
    padding: 6px; border: 3px solid var(--panel-edge); background: var(--bg); color: var(--ink);
  }
  .ex-of {  font-size: 18px; color: var(--ink-dim); position: relative; top: -3px; }

  .heatmap-note {  font-size: 16px; color: var(--ink-muted); margin-bottom: 20px; position: relative; top: -3px; }
  .heatmap-subject { margin-bottom: 30px; }
  .heatmap-subject-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  .heatmap-subject-name.pixel { font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .heatmap-dot { width: 12px; height: 12px; flex-shrink: 0; border: 2px solid var(--shadow); }
  .heatmap-legend { display: flex; align-items: center; gap: 4px; }
  .heatmap-legend-label {  font-size: 14px; color: var(--ink-muted); position: relative; top: -3px; }
  .heatmap-legend-swatch { width: 14px; height: 14px; border: 2px solid var(--shadow); flex-shrink: 0; }
  .heatmap-legend-swatch.empty { background: var(--panel); }
  .heatmap-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .heatmap-modlabel {  font-size: 15px; color: var(--ink-muted); width: 26px; flex-shrink: 0; position: relative; top: -3px; }
  .heatmap-tiles { display: flex; gap: 3px; flex-wrap: wrap; }
  .heatmap-tile { width: 24px; height: 24px; border: 2px solid var(--shadow); cursor: pointer; padding: 0; }
  .heatmap-tile.empty { background: var(--panel); }

  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-navbtn {
    width: 34px; height: 34px; border: 3px solid var(--ink); background: var(--panel); color: var(--ink);
    font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer; box-shadow: 3px 3px 0 var(--shadow);
    display: flex; align-items: center; justify-content: center;
  }
  .cal-navbtn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .cal-title.pixel { font-size: 13px; min-width: 168px; text-align: center; }
  .cal-todaybtn {
    font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 8px 10px;
    border: 3px solid var(--panel-edge); background: var(--panel); color: var(--ink-dim);
    cursor: pointer; box-shadow: 3px 3px 0 var(--shadow);
  }
  .cal-todaybtn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .cal-weekday { text-align: center; font-size: 15px; color: var(--ink-muted); position: relative; top: -3px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 22px; }
  .cal-cell {
    aspect-ratio: 1; background: var(--panel); border: 2px solid var(--panel-edge);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; padding: 2px; color: inherit; font: inherit;
  }
  .cal-cell.empty { background: transparent; border: none; cursor: default; }
  .cal-cell.today { border-color: #F2F2F2; border-width: 3px; }
  .cal-cell.selected { background: var(--panel-edge); }
  .cal-cell:not(.empty):hover { border-color: var(--ink-dim); }
  .cal-daynum { font-size: 19px; position: relative; top: -2px; }
  .cal-dots { display: flex; gap: 2px; margin-top: 2px; height: 6px; }
  .cal-dot { width: 6px; height: 6px; flex-shrink: 0; }
  .cal-count { font-size: 11px; color: var(--ink-dim); position: absolute; bottom: 2px; right: 4px; }
  .cal-cell { position: relative; }

  .cal-jump-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .cal-jump-label { font-size: 13px; color: var(--ink-muted); letter-spacing: 1px; }
  .cal-select {
    font-family: 'VT323', monospace; font-size: 17px; padding: 6px 8px;
    border: 3px solid var(--panel-edge); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  .cal-select:focus { outline: none; border-color: #F2F2F2; }

  .cal-summary { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .cal-summary-stat { flex: 1 1 120px; background: var(--panel); border: 3px solid var(--panel-edge); padding: 10px 12px; box-shadow: 3px 3px 0 var(--shadow); text-align: center; }
  .cal-summary-num.pixel { font-size: 13px; color: #F2F2F2; margin-bottom: 6px; }
  .cal-summary-label { font-size: 11px; color: var(--ink-muted); letter-spacing: 0.5px; }

  .cal-detail { background: var(--panel); border: 3px solid var(--panel-edge); padding: 18px; box-shadow: 5px 5px 0 var(--shadow); }
  .cal-detail-title.pixel { font-size: 12px; margin-bottom: 14px; }
  .cal-task-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 2px solid var(--panel-edge); }
  .cal-task-row:last-of-type { border-bottom: none; }
  .cal-task-check {
    width: 28px; height: 28px; border: 3px solid var(--ink); background: var(--panel); color: var(--maths);
    cursor: pointer; flex-shrink: 0; font-family: 'Press Start 2P', monospace; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-task-check.done { background: var(--maths-tint); border-color: var(--maths); }
  .cal-task-text { flex: 1; font-size: 20px; position: relative; top: -2px; }
  .cal-task-text.done { color: var(--ink-muted); text-decoration: line-through; }
  .cal-task-del {
    width: 28px; height: 28px; border: 3px solid var(--panel-edge); background: var(--panel);
    color: var(--ink-muted); cursor: pointer; flex-shrink: 0; font-family: 'Press Start 2P', monospace; font-size: 11px;
  }
  .cal-empty-note { font-size: 18px; color: var(--ink-muted); padding: 8px 0 16px; position: relative; top: -2px; }
  .cal-add-row { display: flex; gap: 8px; margin-top: 8px; }
  .cal-add-input {
    flex: 1; font-family: 'VT323', monospace; font-size: 20px; padding: 9px;
    border: 3px solid var(--panel-edge); background: var(--bg); color: var(--ink);
  }
  .cal-add-btn {
    font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 0 14px;
    border: 3px solid var(--ink); background: var(--panel); color: var(--ink);
    cursor: pointer; box-shadow: 3px 3px 0 var(--shadow);
  }
  .cal-add-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }

  .stats-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .stats-tab {
    font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 10px 14px;
    border: 3px solid var(--panel-edge); background: var(--panel); color: var(--ink-dim);
    cursor: pointer; box-shadow: 4px 4px 0 var(--shadow);
  }
  .stats-tab.active { border-color: var(--ink); color: var(--ink); background: var(--panel-edge); }
  .stats-tab:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
  .stats-total-box { background: var(--panel); border: 3px solid var(--panel-edge); padding: 24px; margin-bottom: 20px; box-shadow: 5px 5px 0 var(--shadow); text-align: center; }
  .stats-total-num.pixel { font-size: 34px; color: #F2F2F2; text-shadow: 4px 4px 0 var(--shadow); }
  .stats-total-label { font-size: 18px; color: var(--ink-muted); margin-top: 10px; position: relative; top: -2px; }
  .stats-subject-row { background: var(--panel); border: 3px solid var(--panel-edge); padding: 14px 16px; margin-bottom: 10px; box-shadow: 5px 5px 0 var(--shadow); }
  .stats-subject-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .stats-subject-name { display: flex; align-items: center; gap: 10px; }
  .stats-subject-name.pixel { font-size: 12px; }
  .stats-subject-dot { width: 12px; height: 12px; flex-shrink: 0; border: 2px solid var(--shadow); }
  .stats-subject-count { font-size: 20px; color: var(--ink-dim); position: relative; top: -2px; }
  .stats-note { font-size: 16px; color: var(--ink-muted); margin-top: 4px; position: relative; top: -2px; }
  .stats-streak-label { margin-bottom: 4px; }
  .stats-streak-label .pixel { font-size: 11px; }
  .stats-week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 22px; }
  .stats-week-cell {
    background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 0;
    padding: 7px 2px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; transition: transform 0.06s ease;
  }
  .stats-week-cell:active { transform: translate(1px, 1px); }
  .stats-week-cell.future { cursor: default; }
  .stats-week-cell.streak { background: color-mix(in srgb, var(--physics) 28%, var(--panel)); border-color: var(--physics); }
  .stats-week-cell.revision { background: color-mix(in srgb, var(--maths) 28%, var(--panel)); border-color: var(--maths); }
  .stats-week-cell.frozen { background: color-mix(in srgb, var(--chemistry) 28%, var(--panel)); border-color: var(--chemistry); }
  .stats-week-cell.future { opacity: 0.35; }
  .stats-week-cell.selected-day { outline: 2px solid #F2F2F2; outline-offset: 2px; }
  .stats-week-letter { font-size: 13px; color: var(--ink-muted); }
  .stats-week-cell.streak .stats-week-letter { color: var(--physics); }
  .stats-week-cell.revision .stats-week-letter { color: var(--maths); }
  .stats-week-cell.frozen .stats-week-letter { color: var(--chemistry); }
  .stats-week-count { font-size: 16px; color: var(--ink-dim); position: relative; top: -2px; }
  .stats-week-cell.streak .stats-week-count { color: #F2F2F2; }
  .stats-week-cell.revision .stats-week-count { color: #F2F2F2; }
  .stats-week-cell.frozen .stats-week-count { color: #F2F2F2; }
  .stats-nav-row {
    display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px;
  }
  .stats-nav-btn {
    font-family: 'Press Start 2P', monospace; font-size: 12px; padding: 10px 14px;
    border: 3px solid var(--panel-edge); background: var(--panel); color: var(--ink);
    cursor: pointer; box-shadow: 4px 4px 0 var(--shadow);
  }
  .stats-nav-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
  .stats-nav-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }
  .stats-nav-label { font-size: 11px; color: var(--ink); min-width: 140px; text-align: center; }
  .stats-week-glance-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 22px; }
  .stats-week-glance-label { font-size: 12px; color: var(--ink-muted); letter-spacing: 1px; }
  .stats-week-glance-row { display: flex; align-items: center; gap: 8px; width: 100%; }
  .stats-week-glance-row .stats-week-row { flex: 1; margin-bottom: 0; }
  .week-glance-navbtn {
    width: 30px; height: 30px; border: 3px solid var(--ink); background: var(--panel); color: var(--ink);
    font-family: 'Press Start 2P', monospace; font-size: 11px; cursor: pointer; box-shadow: 3px 3px 0 var(--shadow);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .week-glance-navbtn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .week-glance-navbtn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }

  input[type="file"] { display: none; }

  /* ---- revision mode button ---- */
  .revbtn {
    font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 10px 12px;
    border: 3px solid var(--panel-edge); background: var(--panel); color: var(--ink-muted);
    cursor: pointer; box-shadow: 4px 4px 0 var(--shadow); display: flex; align-items: center; gap: 8px;
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .revbtn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
  .revbtn .revdot {
    width: 10px; height: 10px; border: 2px solid var(--shadow); background: var(--ink-muted);
    transition: background-color 0.25s ease;
    flex-shrink: 0;
  }
  .revbtn.on {
    border-color: var(--maths); color: var(--maths); background: var(--maths-tint);
  }
  .revbtn.on .revdot { background: var(--maths); animation: revpulse 0.5s ease; }
  @keyframes revpulse {
    0%   { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--maths) 60%, transparent); }
    50%  { transform: scale(1.6); box-shadow: 0 0 0 6px color-mix(in srgb, var(--maths) 0%, transparent); }
    100% { transform: scale(1); }
  }

  /* ---- streak freeze chip (calendar day detail) ---- */
  .freeze-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--panel-edge); }
  .freeze-label { font-size: 17px; color: var(--ink-dim); position: relative; top: -3px; }
  .freeze-sub { font-size: 14px; color: var(--ink-muted); position: relative; top: -2px; }
  .freeze-btn {
    font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 9px 12px;
    border: 3px solid var(--panel-edge); background: var(--panel); color: var(--ink-muted);
    cursor: pointer; box-shadow: 3px 3px 0 var(--shadow);
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .freeze-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .freeze-btn.on { border-color: var(--chemistry); color: var(--chemistry); background: var(--chemistry-tint); }
  .freeze-btn.on-rev { border-color: var(--maths); color: var(--maths); background: var(--maths-tint); }
  .freeze-btn.disabled { opacity: 0.4; cursor: default; }
  .freeze-status { font-size: 14px; color: #F2F2F2; margin-bottom: 20px; position: relative; top: -2px; letter-spacing: 0.5px; }
  .stats-status-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: -5px; flex-wrap: wrap; }
  .stats-status-row .revbtn { position: relative; top: -25px; }

  .cal-dot.revision { background: var(--maths); }
  .cal-dot.freeze { background: var(--chemistry); }

  /* ---- timer ---- */
  .timer-wrap { text-align: center; padding: 30px 10px 10px; }
  .timer-display {
    font-family: 'Press Start 2P', monospace; font-size: 44px; color: #F2F2F2;
    text-shadow: 4px 4px 0 var(--shadow); letter-spacing: 3px; margin: 10px 0 34px;
    word-break: break-all;
  }
  .timer-display.running { color: var(--maths); text-shadow: 4px 4px 0 var(--shadow); }
  .timer-display.finished { color: var(--physics); animation: timerFlash 0.6s steps(2, start) infinite; }
  @keyframes timerFlash { 50% { opacity: 0.2; } }
  .timer-inputs { display: flex; justify-content: center; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
  .timer-input-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .timer-input-group label { font-size: 13px; color: var(--ink-muted); letter-spacing: 1px; }
  .timer-input-group input {
    width: 72px; font-family: 'Press Start 2P', monospace; font-size: 20px; text-align: center;
    background: var(--panel); border: 3px solid var(--panel-edge); color: var(--ink); padding: 10px 4px;
  }

function exercisesForChapter(chConfig) {
  return EXERCISE_META.map((e) => ({ ...e, sub: e.label.toLowerCase(), total: chConfig[e.key] }));
}
function chapterTotal(chConfig) {
  return exercisesForChapter(chConfig).reduce((s, e) => s + e.total, 0);
}
function getChapter(subject, moduleIndex, chapterIdx) {
  return CURRICULUM[subject][moduleIndex - 1].chapters[chapterIdx - 1];
}
function moduleCount(subject) { return CURRICULUM[subject].length; }
function chapterCount(subject, moduleIndex) { return CURRICULUM[subject][moduleIndex - 1].chapters.length; }
function totalChapterCount(subject) { return CURRICULUM[subject].reduce((s, m) => s + m.chapters.length, 0); }

function makeEmptyProgress() {
  const p = {};
  SUBJECTS.forEach((s) => {
    p[s] = {};
    CURRICULUM[s].forEach((mod, mi) => {
      const m = mi + 1;
      p[s][m] = {};
      mod.chapters.forEach((_, ci) => {
        const c = ci + 1;
        p[s][m][c] = { ex1: 0, ex2: 0 };
      });
    });
  });
  return p;
}

function chapterAgg(progress, subject, moduleIndex, chapterIdx) {
  const chConfig = getChapter(subject, moduleIndex, chapterIdx);
  const exs = exercisesForChapter(chConfig);
  let done = 0;
  exs.forEach((e) => (done += progress[subject]?.[moduleIndex]?.[chapterIdx]?.[e.key] ?? 0));
  return { done, total: chapterTotal(chConfig), name: chConfig.name };
}
function moduleAgg(progress, subject, moduleIndex) {
  let done = 0, total = 0;
  const count = chapterCount(subject, moduleIndex);
  for (let c = 1; c <= count; c++) {
    const a = chapterAgg(progress, subject, moduleIndex, c);
    done += a.done; total += a.total;
  }
  return { done, total, count };
}
function subjectAgg(progress, subject) {
  let done = 0, total = 0;
  const count = moduleCount(subject);
  for (let m = 1; m <= count; m++) {
    const a = moduleAgg(progress, subject, m);
    done += a.done; total += a.total;
  }
  return { done, total };
}
function overallAgg(progress) {
  let done = 0, total = 0;
  SUBJECTS.forEach((s) => { const a = subjectAgg(progress, s); done += a.done; total += a.total; });
  return { done, total };
}
function pct(done, total) { return total === 0 ? 0 : Math.round((done / total) * 100); }
function pctFloor(done, total) { return total === 0 ? 0 : Math.floor((done / total) * 100); }
function questionsToNextPercent(done, total) {
  if (total === 0) return { needed: 0, nextPct: 0 };
  const curPct = pctFloor(done, total);
  if (curPct >= 100) return { needed: 0, nextPct: 100 };
  const nextPct = curPct + 1;
  const needed = Math.max(0, Math.ceil((nextPct / 100) * total) - done);
  return { needed, nextPct };
}

const STORAGE_KEY = "bt-module-log-progress-v1";

// All localStorage writes go through this so a failure (quota exceeded,
// private-browsing restrictions, storage disabled, etc.) is surfaced to the
// user at least once instead of silently vanishing into the console. We only
// alert once per page load so a run of failures doesn't spam the user with
// repeated popups on every keystroke/click.
let storageWarningShown = false;
function safeLocalStorageSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (err) {
    console.error("Save failed", key, err);
    if (!storageWarningShown) {
      storageWarningShown = true;
      alert("Your changes could not be saved to this browser (storage is full or unavailable). Use EXPORT now to back up your progress, then free up space or try a different browser.");
    }
    return false;
  }
}

function loadProgress() {
  const fresh = makeEmptyProgress();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return fresh;
    const parsed = JSON.parse(raw);
    SUBJECTS.forEach((s) => {
      CURRICULUM[s].forEach((mod, mi) => {
        const m = mi + 1;
        mod.chapters.forEach((chConfig, ci) => {
          const c = ci + 1;
          const exs = exercisesForChapter(chConfig);
          exs.forEach((e) => {
            const v = parsed?.[s]?.[m]?.[c]?.[e.key];
            if (typeof v === "number") fresh[s][m][c][e.key] = Math.max(0, Math.min(e.total, v));
          });
        });
      });
    });
  } catch (err) {
    console.warn("Could not load saved progress, starting fresh.", err);
  }
  return fresh;
}

function saveProgress() {
  safeLocalStorageSet(STORAGE_KEY, JSON.stringify(state.progress));
}

function loadPomodoroStats() {
  try {
    const raw = localStorage.getItem(POMODORO_STATS_KEY);
    const today = todayKey();
    if (!raw) return { total: 0, todayCount: 0, todayDate: today };
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return { total: 0, todayCount: 0, todayDate: today };
    return {
      total: typeof parsed.total === "number" ? parsed.total : 0,
      todayCount: parsed.todayDate === today && typeof parsed.todayCount === "number" ? parsed.todayCount : 0,
      todayDate: today,
    };
  } catch (err) {

    return { total: 0, todayCount: 0, todayDate: todayKey() };
  }
}

function recordPomodoroCompleted() {
  const today = todayKey();
  if (state.pomodoroStats.todayDate !== today) {
    state.pomodoroStats.todayDate = today;
    state.pomodoroStats.todayCount = 0;
  }
  state.pomodoroStats.total += 1;
  state.pomodoroStats.todayCount += 1;
  savePomodoroStats();
}
// Flips work<->break, resets the input fields to the new phase's preset length,
// and — when a work session just ended — logs it as a completed pomodoro.
function advancePomodoroPhase() {
  const t = state.timer;
  if (t.phase === "work") {
    recordPomodoroCompleted();
    t.phase = "break";
    t.hInput = 0; t.mInput = t.pomodoroBreakMin; t.sInput = 0;
  } else {
    t.phase = "work";
    t.hInput = 0; t.mInput = t.pomodoroWorkMin; t.sInput = 0;
  }
  t.remainingMs = 0;
}

    freezeDeclined: state.freezeDeclined,
    countdowns: state.countdowns,
    notes: state.notes,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  a.download = `bt-terminal-backup-${stamp}.json`;

function importProgressFromFile(file) {
  const reader = new FileReader();

      // Backward compatible: older exports were just the progress object itself
      // (top-level keys = subject names). Newer exports wrap it as { progress, events, history }.
      const isBundled = parsed && typeof parsed === "object" && parsed.progress && typeof parsed.progress === "object";
      const progressSource = isBundled ? parsed.progress : parsed;
      const eventsSource = isBundled && parsed.events && typeof parsed.events === "object" ? parsed.events : {};
      const historySource = isBundled && Array.isArray(parsed.history) ? parsed.history : [];
      const revisionSource = isBundled && parsed.revisionDays && typeof parsed.revisionDays === "object" ? parsed.revisionDays : {};
      const revisionModeSource = isBundled ? !!parsed.revisionModeOn : false;
      const freezeSource = isBundled && Array.isArray(parsed.freezeDays) ? parsed.freezeDays : [];
      const freezeDeclinedSource = isBundled && parsed.freezeDeclined && typeof parsed.freezeDeclined === "object" ? parsed.freezeDeclined : {};
      const pyqSource = isBundled && parsed.pyq && typeof parsed.pyq === "object" ? parsed.pyq : {};
      const countdownsSource = isBundled && Array.isArray(parsed.countdowns)
        ? parsed.countdowns.filter((c) => c && typeof c.id === "string" && typeof c.label === "string" && typeof c.targetDate === "string")
        : [];
      const notesSource = isBundled && parsed.notes && typeof parsed.notes === "object" && !Array.isArray(parsed.notes) ? parsed.notes : {};

      const merged = makeEmptyProgress();
      SUBJECTS.forEach((s) => {
        CURRICULUM[s].forEach((mod, mi) => {
          const m = mi + 1;
          mod.chapters.forEach((chConfig, ci) => {
            const c = ci + 1;
            const exs = exercisesForChapter(chConfig);
            exs.forEach((e) => {
              const v = progressSource?.[s]?.[m]?.[c]?.[e.key];
              if (typeof v === "number") merged[s][m][c][e.key] = Math.max(0, Math.min(e.total, v));
            });
          });
        });
      });
      state.progress = merged;
      saveProgress();

      const mergedPyq = makeEmptyPyq();
      SUBJECTS.forEach((s) => {
        CURRICULUM[s].forEach((mod, mi) => {
          const m = mi + 1;
          mod.chapters.forEach((_, ci) => {
            const c = ci + 1;
            const v = pyqSource?.[s]?.[m]?.[c];
            if (typeof v === "number") mergedPyq[s][m][c] = Math.max(0, v);
          });
        });
      });
      state.pyq = mergedPyq;
      savePyq();

      state.events = eventsSource;

let timerIntervalId = null;

function timerInputTotalMs() {

  const m = Math.max(0, parseInt(state.timer.mInput, 10) || 0);
  const s = Math.max(0, parseInt(state.timer.sInput, 10) || 0);

}
function timerTick() {

    t.running = false;
    t.finished = true;

    timerIntervalId = null;
    playTimerBeep();

    const totalSec = Math.max(0, Math.round(timerInputTotalMs() / 1000) + Math.round(deltaMs / 1000));

    const ctx = new Ctx();
    [0, 0.35, 0.7].forEach((delay) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = 880;
      gain.gain.value = 0.08;
      osc.connect(gain).connect(ctx.destination);

let pipWindow = null;

function pipSupported() { return "documentPictureInPicture" in window; }

async function openTimerPip() {
  if (!pipSupported()) {

    return;
  }
  if (pipWindow) { pipWindow.focus(); return; }

  try {
    pipWindow = await documentPictureInPicture.requestWindow({ width: 260, height: 180 });
  } catch (err) {
    console.warn("Could not open floating timer", err);
    pipWindow = null;
    return;
  }

  // Carry the pixel theme over into the floating window.
  [...document.styleSheets].forEach((sheet) => {
    try {
      const cssText = [...sheet.cssRules].map((r) => r.cssText).join("\n");
      const style = pipWindow.document.createElement("style");
      style.textContent = cssText;
      pipWindow.document.head.appendChild(style);
    } catch (e) {
      if (sheet.href) {
        const link = pipWindow.document.createElement("link");
        link.rel = "stylesheet";
        link.href = sheet.href;
        pipWindow.document.head.appendChild(link);
      }
    }
  });

  const doc = pipWindow.document;
  doc.title = "BT Timer";
  doc.body.style.cssText = "margin:0; background:var(--bg); color:var(--ink); height:100%; display:flex;";

  const container = doc.createElement("div");

  pipTimeEl.style.cssText = "font-size:26px; color:#F2F2F2; text-shadow:3px 3px 0 var(--shadow); letter-spacing:2px;";
  container.appendChild(pipTimeEl);

  btnRow.style.cssText = "display:flex; gap:8px; flex-wrap:wrap; justify-content:center;";

  const mkBtn = (label, onclick) => {
    const b = doc.createElement("button");
    b.textContent = label;
    b.style.cssText = "font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:3px solid var(--panel-edge); background:var(--panel); color:var(--ink); cursor:pointer; box-shadow:3px 3px 0 var(--shadow);";
    b.onclick = onclick;
    return b;
  };

  pipActionBtn = mkBtn("PAUSE", () => {});
  btnRow.appendChild(pipActionBtn);
  btnRow.appendChild(mkBtn("+1 MIN", () => { adjustTimer(60000); updatePipDisplay(); }));
  container.appendChild(btnRow);

  const closeBtn = mkBtn("CLOSE FLOAT", () => pipWindow && pipWindow.close());
  closeBtn.style.marginTop = "2px";

  pipWindow.addEventListener("pagehide", () => {

}

}
function updatePipDisplay() {

  pipTimeEl.textContent = t.finished ? "TIME'S UP!" : formatTimerMs(ms);

/* ---------------- calendar nav & actions ---------------- */
function dateKey(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
// Returns a Date object whose year/month/day fields are "today" in IST
// (Asia/Kolkata), regardless of the device's own timezone. countdownTargetMs()
// already anchored countdown targets to IST; every other "today" in the app
// (streaks, history, freezes, calendar nav) was pulling the device's own local
// date via bare `new Date()`, which would silently disagree with the IST date
// shown on the dashboard clock if the device isn't set to IST (e.g. travelling
// or a misconfigured clock). Anything that needs "today's calendar date"
// should build it from this, not `new Date()` directly.
function istToday() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(new Date());
  const y = Number(parts.find((p) => p.type === "year").value);
  const m = Number(parts.find((p) => p.type === "month").value);
  const d = Number(parts.find((p) => p.type === "day").value);
  return new Date(y, m - 1, d);
}
function todayKey() {
  const t = istToday();
  return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
}

/* ---------------- stats helpers ---------------- */
function currentWeekMonToSunKeys() {
  const t = istToday();
  const day = t.getDay(); // 0 = Sun ... 6 = Sat
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(t.getFullYear(), t.getMonth(), t.getDate() + diffToMonday);
  const keys = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    keys.push(dateKey(d.getFullYear(), d.getMonth(), d.getDate()));
  }
  return keys;
}
// Cache of date-key -> summed delta, built with a single O(N) pass over
// state.history. dayTotalFor() used to call statsForKeys([key]), which
// re-scanned the *entire* history array on every single call — and
// autoApplyFreezes() calls dayTotalFor() once per day for up to 3650 days
// on every render(). That's O(days * history.length) every render.
// This cache makes each dayTotalFor() call an O(1) lookup instead, so the
// walk becomes O(history.length + days) — built once, reused many times.
let dailyTotalsCache = null;

function invalidateDailyTotalsCache() {
  dailyTotalsCache = null;
}

function getDailyTotalsCache() {
  if (!dailyTotalsCache) {
    dailyTotalsCache = {};
    state.history.forEach((entry) => {
      dailyTotalsCache[entry.date] = (dailyTotalsCache[entry.date] || 0) + entry.delta;
    });
  }
  return dailyTotalsCache;
}

function dayTotalFor(key) {
  const cache = getDailyTotalsCache();
  return Math.max(0, cache[key] || 0);
}
/* ---------------- stats period navigation (day/week/month, offset back from now) ---------------- */
function dayKeyForOffset(offsetDays) {

}
function weekKeysForOffset(offsetWeeks) {

  const keys = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    keys.push(dateKey(d.getFullYear(), d.getMonth(), d.getDate()));
  }
  return keys;
}
function monthKeysForOffset(offsetMonths) {

  const lastDay = offsetMonths === 0 ? t.getDate() : daysInMonth;

  for (let d = 1; d <= lastDay; d++) keys.push(dateKey(y, m, d));

}

}

  const [sy, sm, sd] = keys[0].split("-").map(Number);
  const [ey, em, ed] = keys[6].split("-").map(Number);
  const sMon = MONTH_NAMES[sm - 1].slice(0, 3);
  const eMon = MONTH_NAMES[em - 1].slice(0, 3);
  return sm === em ? `${sMon} ${sd}\u2013${ed}` : `${sMon} ${sd} \u2013 ${eMon} ${ed}`;
}
function monthLabelForOffset(offsetMonths) {
  if (offsetMonths === 0) return "THIS MONTH";
  const t = istToday();
  const target = new Date(t.getFullYear(), t.getMonth() - offsetMonths, 1);
  return `${MONTH_NAMES[target.getMonth()]} ${target.getFullYear()}`;
}
// The set of consecutive days (walking back from today) with activity, forming the
// currently unbroken streak. If today has nothing logged yet, today gets a grace
// period (it isn't "over" yet) and the walk starts from yesterday instead.
function computeStreakDates() {
  const streakDates = new Set();
  const today = istToday();
  let cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  // Today isn't "over" yet, so a quiet day so far never breaks the streak on its own.
  if (dayTotalFor(todayKey()) <= 0) {
    cursor.setDate(cursor.getDate() - 1);
  }
  // Capped the same way autoApplyFreezes() is: without a bound, a long run of
  // revisionDays/freezeDays (e.g. from a corrupted or hand-edited import) makes
  // isProtectedDay() true forever and this becomes a genuine infinite loop that
  // hangs the tab. 3650 days (10 years) is far beyond any real streak.
  let guard = 0;
  while (guard++ < 3650) {
    const key = dateKey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
    if (dayTotalFor(key) > 0) {
      streakDates.add(key);
      cursor.setDate(cursor.getDate() - 1);
    } else if (isProtectedDay(key)) {
      // Revision day or streak freeze: doesn't count as active, but doesn't break the chain either.
      cursor.setDate(cursor.getDate() - 1);
    } else break;
  }
  return streakDates;
}
// Walks back from today (same grace-period rule as computeStreakDates) and, for any
// genuinely missed day (no activity, not already revision/freeze), automatically
// spends a streak freeze on it if one is available (1 per calendar week, reset
// Monday). Stops as soon as a miss can't be covered, which naturally bounds
// this to a couple of days.
function autoApplyFreezes() {
  const today = istToday();
  let cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (dayTotalFor(todayKey()) <= 0) {
    cursor.setDate(cursor.getDate() - 1);
  }
  let changed = false;
  let guard = 0;
  while (guard++ < 3650) {
    const key = dateKey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
    if (dayTotalFor(key) > 0) {
      cursor.setDate(cursor.getDate() - 1);
      continue;
    }
    if (isRevisionDay(key) || isFreezeDay(key)) {
      cursor.setDate(cursor.getDate() - 1);
      continue;
    }
    if (isFreezeDeclined(key)) {
      // User explicitly turned this one off from the calendar \u2014 respect it,
      // treat it as a genuine miss and stop extending the streak here.
      break;
    }
    if (canUseFreeze(key)) {
      state.freezeDays.push(key);
      changed = true;
      cursor.setDate(cursor.getDate() - 1);
      continue;
    }
    break;
  }
  if (changed) saveFreezeDays();
}
function formatDateLabel(key) {
  const [y, m, d] = key.split("-").map(Number);
  return `${MONTH_NAMES[m - 1]} ${d}, ${y}`;
}
function statsForKeys(keys) {
  const keySet = new Set(keys);
  const bySubject = {};
  SUBJECTS.forEach((s) => (bySubject[s] = 0));
  let total = 0;
  state.history.forEach((entry) => {
    if (keySet.has(entry.date)) {
      bySubject[entry.subject] = (bySubject[entry.subject] || 0) + entry.delta;
      total += entry.delta;
    }
  });
  SUBJECTS.forEach((s) => (bySubject[s] = Math.max(0, bySubject[s])));
  return { total: Math.max(0, total), bySubject };
}
function goCalendar() {

function calPrevMonth() {
  let { calYear, calMonth } = state.nav;
  calMonth -= 1;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }

function calNextMonth() {

}
// Totals problems solved across every day of a given month, plus the busiest
// day and how many days had any activity \u2014 used for the calendar's summary
// strip and to scale each cell's heatmap tint.
function monthActivitySummary(calYear, calMonth) {
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  let total = 0, activeDays = 0, bestDay = null, bestTotal = 0, maxDay = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(calYear, calMonth, d);
    const dayTotal = dayTotalFor(key);
    total += dayTotal;
    if (dayTotal > 0) activeDays += 1;
    if (dayTotal > maxDay) maxDay = dayTotal;
    if (dayTotal > bestTotal) { bestTotal = dayTotal; bestDay = d; }
  }
  return { total, activeDays, daysInMonth, bestDay, bestTotal, maxDay };
}
function calGoToday() {

function addEvent(dateKeyStr, text) {
  const trimmed = text.trim();
  if (!trimmed) return;
  if (!state.events[dateKeyStr]) state.events[dateKeyStr] = [];
  state.events[dateKeyStr].push({ id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, text: trimmed, done: false });
  saveEvents();
  render();
}
function toggleEvent(dateKeyStr, id) {
  const list = state.events[dateKeyStr];
  if (!list) return;
  const item = list.find((e) => e.id === id);
  if (item) item.done = !item.done;
  saveEvents();
  render();
}
function deleteEvent(dateKeyStr, id) {
  const list = state.events[dateKeyStr];
  if (!list) return;
  state.events[dateKeyStr] = list.filter((e) => e.id !== id);
  if (state.events[dateKeyStr].length === 0) delete state.events[dateKeyStr];
  saveEvents();
  render();
}

function setExercise(subject, moduleIndex, chapterIdx, key, value, total) {

  state.progress[subject][moduleIndex][chapterIdx][key] = clamped;

}
/* ---------------- rendering (retro skin) ---------------- */
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k === "title") node.title = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

function pixelBar(done, total, accent, segments = 12, height = 16) {
  const p = pct(done, total);
  const filled = Math.round((p / 100) * segments);
  const wrap = el("div", { class: "pixel-bar", style: `height:${height}px` });
  for (let i = 0; i < segments; i++) {
    wrap.appendChild(el("div", {
      class: "pixel-bar-seg",
      style: i < filled ? `background:${accent}` : "",
    }));
  }
  return wrap;
}

function statLine(done, total) {
  return el("span", { class: "stat", text: `${done}/${total} \u00b7 ${pct(done, total)}%` });
}

// Renders the "REDUCED/REMOVED tag \u00b7 2026: X Qs \u2191 \u00b7 2025: Y Qs" row for a
// chapter, if exam data exists for it. Returns null (skipped by el()) otherwise.
function examRow(subject, chapterName) {
  const d = EXAM_DATA[subject] && EXAM_DATA[subject][chapterName];
  if (!d) return null;
  const arrow = d.y2026 === d.y2025 ? null : d.y2026 > d.y2025 ? "up" : "down";
  const bits = [];
  if (d.tag) bits.push(el("span", { class: `exam-tag ${d.tag} pixel`, text: d.tag.toUpperCase() }));
  bits.push(el("span", {}, [
    document.createTextNode(`2026: ${d.y2026} Qs`),
    arrow ? el("span", { class: `exam-arrow ${arrow}`, text: arrow === "up" ? " \u2191" : " \u2193" }) : null,
  ]));
  bits.push(el("span", {}, [
    document.createTextNode(`2025: ${d.y2025} Qs`),
    d.note ? el("span", { class: "exam-note", title: d.note, text: " *" }) : null,
  ]));
  const row = el("div", { class: "exam-row mono" });
  bits.forEach((b, i) => {
    if (i > 0) row.appendChild(el("span", { class: "exam-sep", text: "\u00b7" }));
    row.appendChild(b);
  });
  return row;
}

function crumbs(items, onJump) {
  const wrap = el("div", { class: "crumbs" });
  items.forEach((label, i) => {
    if (i > 0) wrap.appendChild(el("span", { class: "crumb-sep", text: "/" }));
    const btn = el("button", { text: label.toUpperCase() });
    if (i === items.length - 1) btn.disabled = true;
    else btn.addEventListener("click", () => onJump(i));
    wrap.appendChild(btn);
  });
  return wrap;
}
