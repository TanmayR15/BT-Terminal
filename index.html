const WEEKDAY_LABELS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

function renderCalendar() {
  const wrap = el("div");
  wrap.appendChild(crumbs(["Home", "Calendar"], (i) => { if (i === 0) goHome(); }));

  const { calYear, calMonth, selectedDate } = state.nav;
  const today = todayKey();

  const nav = el("div", { class: "cal-nav" }, [
    el("button", { class: "cal-navbtn", text: "\u2190", onclick: calPrevMonth, "aria-label": "Previous month" }),
    el("span", { class: "cal-title pixel", text: `${MONTH_NAMES[calMonth]} ${calYear}` }),
    el("button", { class: "cal-navbtn", text: "\u2192", onclick: calNextMonth, "aria-label": "Next month" }),
  ]);
  wrap.appendChild(el("div", { class: "cal-header" }, [
    nav,
    el("button", { class: "cal-todaybtn", text: "TODAY", onclick: calGoToday }),
  ]));

  // quick jump-to-month/year, for hopping across the calendar without clicking
  // the arrow dozens of times when reviewing a distant month
  const monthSelect = el("select", { class: "cal-select" });
  MONTH_NAMES.forEach((name, i) => {
    monthSelect.appendChild(el("option", { value: String(i), text: name.slice(0, 3) }));
  });
  monthSelect.value = String(calMonth);
  monthSelect.addEventListener("change", (e) => calSetMonth(calYear, parseInt(e.target.value, 10)));

  const yearSelect = el("select", { class: "cal-select" });
  const thisYear = istToday().getFullYear();
  for (let y = thisYear - 3; y <= thisYear + 2; y++) {
    yearSelect.appendChild(el("option", { value: String(y), text: String(y) }));
  }
  yearSelect.value = String(calYear);
  yearSelect.addEventListener("change", (e) => calSetMonth(parseInt(e.target.value, 10), calMonth));

  wrap.appendChild(el("div", { class: "cal-jump-row" }, [
    el("span", { class: "cal-jump-label", text: "JUMP TO:" }),
    monthSelect,
    yearSelect,
  ]));

  // month summary strip
  const summary = monthActivitySummary(calYear, calMonth);
  wrap.appendChild(el("div", { class: "cal-summary" }, [
    el("div", { class: "cal-summary-stat" }, [
      el("div", { class: "cal-summary-num pixel", text: String(summary.total) }),
      el("div", { class: "cal-summary-label", text: "SOLVED THIS MONTH" }),
    ]),
    el("div", { class: "cal-summary-stat" }, [
      el("div", { class: "cal-summary-num pixel", text: `${summary.activeDays}/${summary.daysInMonth}` }),
      el("div", { class: "cal-summary-label", text: "ACTIVE DAYS" }),
    ]),
    el("div", { class: "cal-summary-stat" }, [
      el("div", { class: "cal-summary-num pixel", text: summary.bestDay ? `${MONTH_NAMES[calMonth].slice(0, 3)} ${summary.bestDay}` : "\u2014" }),
      el("div", { class: "cal-summary-label", text: summary.bestDay ? `BEST DAY \u00b7 ${summary.bestTotal}` : "BEST DAY" }),
    ]),
  ]));

  const weekdayRow = el("div", { class: "cal-weekdays" });
  WEEKDAY_LABELS.forEach((w) => weekdayRow.appendChild(el("span", { class: "cal-weekday", text: w })));
  wrap.appendChild(weekdayRow);

  const firstOfMonth = new Date(calYear, calMonth, 1);
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const leadingBlanks = firstOfMonth.getDay();

  const grid = el("div", { class: "cal-grid" });
  for (let i = 0; i < leadingBlanks; i++) {
    grid.appendChild(el("div", { class: "cal-cell empty" }));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(calYear, calMonth, d);
    const tasks = state.events[key] || [];
    let cls = "cal-cell";
    if (key === today) cls += " today";
    if (key === selectedDate) cls += " selected";

    // faint activity tint, scaled against this month's busiest day, so the
    // grid doubles as a mini heatmap at a glance
    const dayTotal = dayTotalFor(key);
    let cellStyle = "";
    if (dayTotal > 0 && summary.maxDay > 0 && key !== selectedDate) {
      const intensity = Math.min(1, dayTotal / summary.maxDay);
      cellStyle = `background:color-mix(in srgb, var(--physics) ${Math.round(intensity * 55)}%, var(--panel))`;
    }

    const dots = el("div", { class: "cal-dots" });
    if (tasks.length > 0) {
      const allDone = tasks.every((t) => t.done);
      dots.appendChild(el("span", { class: "cal-dot", style: `background:${allDone ? "var(--physics)" : "#F2F2F2"}` }));
    }
    if (isRevisionDay(key)) dots.appendChild(el("span", { class: "cal-dot revision" }));
    if (isFreezeDay(key)) dots.appendChild(el("span", { class: "cal-dot freeze" }));

    const cellChildren = [
      el("span", { class: "cal-daynum", text: String(d) }),
      dots,
    ];
    if (dayTotal > 0) cellChildren.push(el("span", { class: "cal-count", text: String(dayTotal) }));

    grid.appendChild(el("button", { class: cls, style: cellStyle, onclick: () => calSelectDay(key) }, cellChildren));
  }
  wrap.appendChild(grid);

  if (selectedDate) wrap.appendChild(renderDayDetail(selectedDate));

  return wrap;
}

function renderDayDetail(key) {
  const [y, m, d] = key.split("-").map(Number);
  const label = `${MONTH_NAMES[m - 1]} ${d}, ${y}`;
  const tasks = state.events[key] || [];

  const detail = el("div", { class: "cal-detail" });
  detail.appendChild(el("div", { class: "cal-detail-title pixel", text: label }));

  if (tasks.length === 0) {
    detail.appendChild(el("div", { class: "cal-empty-note", text: "Nothing scheduled yet." }));
  } else {
    tasks.forEach((task) => {
      const checkbox = el("button", {
        class: task.done ? "cal-task-check done" : "cal-task-check",
        text: task.done ? "\u2713" : "",
        onclick: () => toggleEvent(key, task.id),
        "aria-label": "Toggle complete",
      });
      const text = el("span", { class: task.done ? "cal-task-text done" : "cal-task-text", text: task.text });
      const del = el("button", { class: "cal-task-del", text: "\u2715", onclick: () => deleteEvent(key, task.id), "aria-label": "Delete" });
      detail.appendChild(el("div", { class: "cal-task-row" }, [checkbox, text, del]));
    });
  }

  const input = el("input", { class: "cal-add-input", type: "text", placeholder: "Schedule something\u2026" });
  const submit = () => { addEvent(key, input.value); };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  const addBtn = el("button", { class: "cal-add-btn", text: "ADD", onclick: submit });
  detail.appendChild(el("div", { class: "cal-add-row" }, [input, addBtn]));

  const revOn = isRevisionDay(key);
  const revToggle = el("button", {
    class: revOn ? "freeze-btn on-rev" : "freeze-btn",
    onclick: () => toggleRevisionDay(key),
  }, [
    el("span", { class: "revdot", style: revOn ? "background:var(--maths)" : "" }),
    el("span", { text: revOn ? "REVISION: ON" : "MARK REVISION DAY" }),
  ]);
  detail.appendChild(el("div", { class: "freeze-row" }, [
    el("div", {}, [
      el("div", { class: "freeze-label", text: "Revision day" }),
      el("div", { class: "freeze-sub", text: "Excluded from streak \u2014 no solving expected" }),
    ]),
    revToggle,
  ]));

  const freezeOn = isFreezeDay(key);
  const freezeBlocked = !freezeOn && !canUseFreeze(key);
  const freezeToggle = el("button", {
    class: [freezeOn ? "freeze-btn on" : "freeze-btn", freezeBlocked ? "disabled" : ""].join(" ").trim(),
    onclick: () => toggleFreezeDay(key),
  }, [
    el("span", { text: freezeOn ? "\u2744\uFE0F FREEZE: ON" : "\u2744\uFE0F USE FREEZE" }),
  ]);
  detail.appendChild(el("div", { class: "freeze-row" }, [
    el("div", {}, [
      el("div", { class: "freeze-label", text: "Streak freeze" }),
      el("div", { class: "freeze-sub", text: "1 per week (resets Mon) \u00b7 protects a missed day" }),
    ]),
    freezeToggle,
  ]));

  return detail;
}

/* ================= pace & projection =================
   Derived from the same history log the stats page uses, so it needs no extra
   storage: recent throughput -> questions/day, plus a couple of other
   at-a-glance progress numbers. */
function paceForLastDays(nDays) {
  const keys = [];
  for (let i = 0; i < nDays; i++) keys.push(dayKeyForOffset(i));
  const s = statsForKeys(keys);
  return { total: s.total, perDay: s.total / nDays, bySubject: s.bySubject };
}
function bestDayTotalForLastDays(nDays) {
  let max = 0;
  for (let i = 0; i < nDays; i++) max = Math.max(max, dayTotalFor(dayKeyForOffset(i)));
  return max;
}

function renderPaceBox() {
  const overall = overallAgg(state.progress);
  const p7 = paceForLastDays(7);
  const p30 = paceForLastDays(30);
  const nextPct = questionsToNextPercent(overall.done, overall.total);

  const box = el("div", { class: "pace-box" });
  box.appendChild(el("span", { class: "pace-title pixel", text: "PACE \u0026 PROJECTION" }));

  const row = (key, value, cls) => el("div", { class: "pace-row" }, [
    el("span", { class: "pace-key", text: key }),
    el("span", { class: `pace-val${cls ? " " + cls : ""}`, text: value }),
  ]);

  box.appendChild(row("Last 7 days", `${p7.total} q \u00b7 ${p7.perDay.toFixed(1)}/day`));
  box.appendChild(row("Last 30 days", `${p30.total} q \u00b7 ${p30.perDay.toFixed(1)}/day`));
  box.appendChild(row("Qs to next %", `${nextPct.needed}q to ${nextPct.nextPct}%`));
  box.appendChild(row("Best day (30d)", `${bestDayTotalForLastDays(30)} q`));

  return box;
}

function renderStats() {
  const wrap = el("div");
  wrap.appendChild(crumbs(["Home", "Stats"], (i) => { if (i === 0) goHome(); }));

  const period = state.nav.statsPeriod || "day";
  const offset = state.nav.statsOffset || 0;

  const tabs = el("div", { class: "stats-tabs" });
  [["day", "1 DAY"], ["week", "7 DAYS"], ["month", "1 MONTH"]].forEach(([key, label]) => {
    tabs.appendChild(el("button", {
      class: period === key ? "stats-tab active" : "stats-tab",
      text: label,
      onclick: () => setStatsPeriod(key),
    }));
  });
  wrap.appendChild(tabs);

  let keys, periodLabel;
  if (period === "day") { keys = [dayKeyForOffset(offset)]; periodLabel = dayLabelForOffset(offset); }
  else if (period === "week") { keys = weekKeysForOffset(offset); periodLabel = weekLabelForOffset(offset); }
  else { keys = monthKeysForOffset(offset); periodLabel = monthLabelForOffset(offset); }

  wrap.appendChild(el("div", { class: "stats-nav-row" }, [
    el("button", { class: "stats-nav-btn", text: "\u2190", onclick: () => shiftStatsOffset(1) }),
    el("span", { class: "stats-nav-label pixel", text: periodLabel }),
    el("button", {
      class: offset === 0 ? "stats-nav-btn disabled" : "stats-nav-btn",
      text: "\u2192",
      onclick: () => shiftStatsOffset(-1),
    }),
  ]));

  // week-at-a-glance strip: Mon..Sun of the current calendar week, with the
  // currently unbroken streak highlighted
  const streakDates = computeStreakDates();
  const weekGlanceOffset = state.statsWeekOffset || 0;
  const weekKeys = weekKeysForOffset(weekGlanceOffset);
  const weekLetters = ["M", "T", "W", "T", "F", "S", "S"];
  const today = todayKey();

  const streakLabel = el("div", { class: "stats-streak-label" }, [
    streakDates.size > 0
      ? el("span", { class: "pixel", style: "color:var(--physics)", text: `\uD83D\uDD25 ${streakDates.size} DAY STREAK` })
      : el("span", { class: "pixel", style: "color:var(--ink-muted)", text: "NO ACTIVE STREAK" }),
  ]);
  wrap.appendChild(streakLabel);

  const freezeAvailable = canUseFreeze(today);
  const revOn = state.revisionModeOn;
  const revBtn = el("button", {
    class: revOn ? "revbtn on" : "revbtn",
    onclick: () => toggleRevisionMode(),
  }, [
    el("span", { class: "revdot" }),
    el("span", { text: revOn ? "REVISION: ON" : "REVISION MODE" }),
  ]);
  wrap.appendChild(el("div", { class: "stats-status-row" }, [
    el("div", { class: "freeze-status", style: "margin-bottom:0", text:
      freezeAvailable ? "\u2744\uFE0F Streak freeze available (1 per week)" : "\u2744\uFE0F Streak freeze used this week \u2014 resets Monday"
    }),
    revBtn,
  ]));

  const weekRow = el("div", { class: "stats-week-row" });
  const selectedDayKey = period === "day" ? dayKeyForOffset(offset) : null;
  weekKeys.forEach((key, i) => {

    const isFuture = key > today;
    const inStreak = streakDates.has(key);
    const protectedDay = !isFuture && !inStreak && dayTotalFor(key) === 0 && isProtectedDay(key);
    let cls = "stats-week-cell";
    if (inStreak) cls += " streak";
    else if (protectedDay) cls += isFreezeDay(key) ? " frozen" : " revision";
    if (isFuture) cls += " future";
    if (key === selectedDayKey) cls += " selected-day";
    const count = isFuture ? "\u2013" : (protectedDay ? (isFreezeDay(key) ? "\u2744\uFE0F" : "\uD83D\uDCD6") : String(dayTotalFor(key)));
    weekRow.appendChild(el("div", {
      class: cls,
      onclick: isFuture ? () => {} : () => selectStatsDay(key),
    }, [
      el("span", { class: "stats-week-letter", text: weekLetters[i] }),
      el("span", { class: "stats-week-count", text: count }),
    ]));
  });
  const weekGlanceWrap = el("div", { class: "stats-week-glance-wrap" }, [
    el("div", { class: "stats-week-glance-label", text: weekLabelForOffset(weekGlanceOffset) }),
    el("div", { class: "stats-week-glance-row" }, [
      el("button", {
        class: "week-glance-navbtn", text: "\u2190", "aria-label": "Previous week",
        onclick: () => shiftWeekGlance(1),
      }),
      weekRow,
      el("button", {
        class: weekGlanceOffset === 0 ? "week-glance-navbtn disabled" : "week-glance-navbtn",
        text: "\u2192", "aria-label": "Next week",
        onclick: () => shiftWeekGlance(-1),
      }),
    ]),
  ]);
  wrap.appendChild(weekGlanceWrap);

  const stats = statsForKeys(keys);

  wrap.appendChild(el("div", { class: "stats-total-box" }, [
    el("div", { class: "stats-total-num pixel", text: String(stats.total) }),
    el("div", { class: "stats-total-label", text: `QUESTIONS DONE \u2014 ${periodLabel}` }),
  ]));

  SUBJECTS.forEach((s) => {
    const t = THEME[s];
    const count = stats.bySubject[s] || 0;
    const shareOfTotal = stats.total > 0 ? count / stats.total : 0;
    wrap.appendChild(el("div", { class: "stats-subject-row" }, [
      el("div", { class: "stats-subject-top" }, [
        el("div", { class: "stats-subject-name" }, [
          el("span", { class: "stats-subject-dot", style: `background:${t.accent}` }),
          el("span", { class: "pixel", text: s.toUpperCase() }),
        ]),
        el("span", { class: "stats-subject-count", text: String(count) }),
      ]),
      pixelBar(shareOfTotal * 100, 100, t.accent, 20, 10),
    ]));
  });

  wrap.appendChild(renderPaceBox());

  if (state.history.length === 0) {
    wrap.appendChild(el("div", { class: "stats-note", text: "Stats start tracking from now \u2014 log a few questions and this page fills in." }));
  }

  return wrap;
}

function renderTimer() {
  const wrap = el("div");
  wrap.appendChild(crumbs(["Home", "Timer"], (i) => { if (i === 0) goHome(); }));

  const t = state.timer;
  const displayMs = t.running || t.finished || t.remainingMs > 0 ? t.remainingMs : timerInputTotalMs();
  const dispClass = t.finished ? "timer-display finished" : (t.running ? "timer-display running" : "timer-display");

  const timerWrap = el("div", { class: "timer-wrap" });

  if (t.pomodoroMode) {
    timerWrap.appendChild(el("div", { class: "pomo-phase-badge", text:
      t.phase === "work" ? "WORK SESSION" : "\u2615 BREAK"
    }));
  }

  timerWrap.appendChild(el("div", {
    class: dispClass,
    text: t.finished ? "TIME'S UP!" : formatTimerMs(displayMs),
  }));

  const hInput = el("input", { type: "number", min: "0", max: "23" });
  hInput.value = t.hInput;
  hInput.disabled = t.running || t.finished;
  hInput.addEventListener("change", (e) => { t.hInput = Math.max(0, Math.min(23, parseInt(e.target.value, 10) || 0)); render(); });

  const mInput = el("input", { type: "number", min: "0", max: "59" });
  mInput.value = t.mInput;
  mInput.disabled = t.running || t.finished;
  mInput.addEventListener("change", (e) => { t.mInput = Math.max(0, Math.min(59, parseInt(e.target.value, 10) || 0)); render(); });

  const sInput = el("input", { type: "number", min: "0", max: "59" });
  sInput.value = t.sInput;
  sInput.disabled = t.running || t.finished;
  sInput.addEventListener("change", (e) => { t.sInput = Math.max(0, Math.min(59, parseInt(e.target.value, 10) || 0)); render(); });

  timerWrap.appendChild(el("div", { class: "timer-inputs" }, [
    el("div", { class: "timer-input-group" }, [hInput, el("label", { text: "HRS" })]),
    el("div", { class: "timer-input-group" }, [mInput, el("label", { text: "MIN" })]),
    el("div", { class: "timer-input-group" }, [sInput, el("label", { text: "SEC" })]),
  ]));

  const applyPreset = (workMin, breakMin) => {
    if (t.running) return;
    t.pomodoroMode = true;
    t.phase = "work";
    t.pomodoroWorkMin = workMin;
    t.pomodoroBreakMin = breakMin;
    t.hInput = 0; t.mInput = workMin; t.sInput = 0;
    t.finished = false; t.remainingMs = 0;
    render();
  };
  const presetBtn = (label, workMin, breakMin) => el("button", {
    class: `pomodoro-btn${t.running ? " disabled" : ""}`,
    text: label,
    onclick: () => applyPreset(workMin, breakMin),
  });
  timerWrap.appendChild(el("div", { class: "pomodoro-row" }, [
    presetBtn("25/5 POMODORO", 25, 5),
    presetBtn("50/10 DEEP WORK", 50, 10),
    presetBtn("90/15 LONG BLOCK", 90, 15),
  ]));

  const pomodoroModeBtn = el("button", {
    class: t.pomodoroMode ? "mute-btn on" : "mute-btn",
    text: t.pomodoroMode ? "POMODORO MODE: ON" : "POMODORO MODE: OFF",
    onclick: () => {
      t.pomodoroMode = !t.pomodoroMode;
      if (t.pomodoroMode) t.phase = "work";
      render();
    },
  });
  timerWrap.appendChild(el("div", { class: "timer-btn-row timer-add-row pomodoro-mode-row" }, [pomodoroModeBtn]));

  const startBtn = el("button", {
    class: `timer-btn start${t.running ? " disabled" : ""}`,
    text: (t.remainingMs > 0 && !t.running && !t.finished) ? "RESUME" : "START",
    onclick: startTimer,
  });
  const pauseBtn = el("button", {
    class: `timer-btn pause${!t.running ? " disabled" : ""}`,
    text: "PAUSE",
    onclick: pauseTimer,
  });
  const resetBtn = el("button", {
    class: `timer-btn reset${(!t.running && !t.finished && t.remainingMs <= 0) ? " disabled" : ""}`,
    text: "RESET",
    onclick: resetTimer,
  });

  timerWrap.appendChild(el("div", { class: "timer-btn-row" }, [startBtn, pauseBtn, resetBtn]));

  const addBtn = (label, ms) => el("button", { class: "timer-btn add", text: label, onclick: () => adjustTimer(ms) });
  timerWrap.appendChild(el("div", { class: "timer-btn-row timer-add-row" }, [
    addBtn("+1 MIN", 60000),
    addBtn("+5 MIN", 5 * 60000),
    addBtn("+10 MIN", 10 * 60000),
  ]));

  const floatBtn = el("button", {
    class: "timer-btn add",
    text: pipWindow ? "\uD83D\uDCFA FLOATING\u2026" : "\uD83D\uDCFA FLOAT ON TOP",
    onclick: pipWindow ? closeTimerPip : openTimerPip,
  });
  timerWrap.appendChild(el("div", { class: "timer-btn-row timer-add-row" }, [floatBtn]));

  timerWrap.appendChild(el("div", { class: "timer-status", text:
    t.finished
      ? (t.pomodoroMode
          ? (t.phase === "break" ? "\u2615 Work session done \u2014 start your break." : "\uD83D\uDD14 Break's over \u2014 start your next session.")
          : "\u23F0 Countdown finished.")
      : (t.running ? "\u25B6 Counting down\u2026" : "Set a duration and hit START.")
  }));

  wrap.appendChild(timerWrap);
  return wrap;
}

function computeCountdownDisplay(targetMs) {
  const remainMs = targetMs - Date.now();
  let bigText, subText, passed;
  if (remainMs <= 0) {
    const overdueDays = Math.floor(Math.abs(remainMs) / 86400000);
    bigText = overdueDays === 0 ? "TODAY" : `+${overdueDays}D`;
    subText = overdueDays === 0 ? "It's today!" : `${overdueDays} day${overdueDays === 1 ? "" : "s"} ago`;
    passed = true;
  } else {
    const days = Math.floor(remainMs / 86400000);
    const hrs = Math.floor((remainMs % 86400000) / 3600000);
    const mins = Math.floor((remainMs % 3600000) / 60000);
    const secs = Math.floor((remainMs % 60000) / 1000);
    bigText = `${days}D`;
    subText = `${fmt2(hrs)}:${fmt2(mins)}:${fmt2(secs)} remaining`;
    passed = false;
  }
  return { bigText, subText, passed };
}

function renderDashboard() {
  const wrap = el("div");
  const dashWrap = el("div", { class: "dash-wrap" });

  dashWrap.appendChild(el("div", { class: "dash-clock-label", text: "INDIAN STANDARD TIME" }));
  dashWrap.appendChild(el("div", { class: "dash-clock pixel", id: "dash-clock", text: getISTTimeString() }));
  dashWrap.appendChild(el("div", { class: "dash-date", id: "dash-date", text: getISTDateString() }));

  wrap.appendChild(dashWrap);

  const daysSinceExport = state.lastExportAt ? Math.floor((Date.now() - state.lastExportAt) / 86400000) : null;
  if (daysSinceExport === null || daysSinceExport >= 7) {
    wrap.appendChild(el("div", { class: "backup-banner" }, [
      el("div", { class: "backup-banner-text", text: daysSinceExport === null
        ? "\u26A0\uFE0F You haven't backed up your progress yet."
        : `\u26A0\uFE0F Last backup was ${daysSinceExport} day${daysSinceExport === 1 ? "" : "s"} ago.` }),
      el("button", { class: "backup-banner-btn", text: "EXPORT NOW", onclick: exportProgress }),
    ]));
  }

  const pinned = state.pinnedChapter;
  if (pinned) {
    const chConfig = getChapter(pinned.subject, pinned.moduleIndex, pinned.chapterIdx);
    const agg = chapterAgg(state.progress, pinned.subject, pinned.moduleIndex, pinned.chapterIdx);
    const t = THEME[pinned.subject];
    const chProgress = state.progress[pinned.subject][pinned.moduleIndex][pinned.chapterIdx];
    const ex1Done = chProgress.ex1;
    const ex1Total = chConfig.ex1;
    const ex2Done = chProgress.ex2;
    const ex2Total = chConfig.ex2;
    const quickAdd = (exKey, exDone, exTotal, n) => {
      state.focusUndoStack.push({ subject: pinned.subject, moduleIndex: pinned.moduleIndex, chapterIdx: pinned.chapterIdx, exKey, prevValue: exDone, total: exTotal });
      if (state.focusUndoStack.length > 50) state.focusUndoStack.shift(); // cap so it can't grow unbounded in one session
      setExercise(pinned.subject, pinned.moduleIndex, pinned.chapterIdx, exKey, exDone + n, exTotal);
    };
    // Pops and reverts the most recent quick-add, one click at a time, so pressing
    // undo repeatedly walks back through everything you just did. The stack is
    // cleared on every pin/unpin (see togglePin), so it can never straddle two
    // different chapters \u2014 pressing undo after switching pins is always a no-op.
    const undoFocus = () => {
      const stack = state.focusUndoStack;
      if (stack.length === 0) return;
      const u = stack.pop();
      if (u.subject !== pinned.subject || u.moduleIndex !== pinned.moduleIndex || u.chapterIdx !== pinned.chapterIdx) return;
      setExercise(u.subject, u.moduleIndex, u.chapterIdx, u.exKey, u.prevValue, u.total);
    };

    const quickRow = [
      el("button", { class: "focus-goto", text: "+1 EX-1", onclick: () => quickAdd("ex1", ex1Done, ex1Total, 1) }),
      el("button", { class: "focus-goto", text: "+1 EX-2", onclick: () => quickAdd("ex2", ex2Done, ex2Total, 1) }),
      el("button", { class: "focus-goto", text: "\u21B6 UNDO", onclick: undoFocus }),
      el("button", { class: "focus-goto", text: "OPEN CHAPTER \u2192", onclick: () => goChapter(pinned.subject, pinned.moduleIndex, pinned.chapterIdx) }),
      el("button", { class: "focus-unpin", text: "unpin", onclick: () => togglePin(pinned.subject, pinned.moduleIndex, pinned.chapterIdx) }),
    ];

    wrap.appendChild(el("div", { class: "focus-wrap" }, [
      el("div", { class: "dash-section-title", style: "margin-bottom:12px;", text: "TODAY'S FOCUS" }),
      el("div", { class: "focus-card", style: `border-left:6px solid ${t.accent}` }, [
        el("div", { class: "focus-top" }, [
          el("span", { class: "focus-name pixel", text: chConfig.name.toUpperCase() }),
          statLine(agg.done, agg.total),
        ]),
        el("div", { class: "focus-sub", text: `${pinned.subject.toUpperCase()} \u00b7 MODULE ${pinned.moduleIndex} \u00b7 EX-1: ${ex1Done}/${ex1Total} \u00b7 EX-2: ${ex2Done}/${ex2Total}` }),
        pixelBar(agg.done, agg.total, t.accent),
        el("div", { class: "focus-quick-row" }, quickRow),
      ]),
    ]));
  }

  const cdSection = el("div", { class: "dash-countdowns" });
  const addToggleBtn = el("button", {
    class: "cd-add-toggle pixel", text: state.cdFormOpen ? "\u2212" : "+",
    "aria-label": "Add a countdown",
    onclick: () => { state.cdFormOpen = !state.cdFormOpen; render(); },
  });
  cdSection.appendChild(el("div", { class: "dash-countdowns-header" }, [
    el("div", { class: "dash-section-title pixel", text: "COUNTDOWNS" }),
    addToggleBtn,
  ]));

  if (state.cdFormOpen) {
    const labelInput = el("input", { class: "cd-input", type: "text", placeholder: "What are you counting down to\u2026" });
    const dateInput = el("input", { class: "cd-date-input", type: "date" });
    const addBtn = el("button", {
      class: "cd-add-btn", text: "ADD",
      onclick: () => { addCountdown(labelInput.value, dateInput.value); state.cdFormOpen = false; },
    });
    cdSection.appendChild(el("div", { class: "cd-add-row" }, [labelInput, dateInput, addBtn]));
  }

  const sorted = [...state.countdowns].sort((a, b) => countdownTargetMs(a.targetDate) - countdownTargetMs(b.targetDate));

  if (sorted.length === 0) {
    cdSection.appendChild(el("div", { class: "cd-empty", text: "No countdowns yet \u2014 tap + to add one." }));
  } else {
    const grid = el("div", { class: "cd-grid" });
    const themeKeys = SUBJECTS; // cycle through the subject accent colors for visual variety
    sorted.forEach((c, i) => {
      const targetMs = countdownTargetMs(c.targetDate);
      const accent = THEME[themeKeys[i % themeKeys.length]].accent;
      const { bigText, subText, passed } = computeCountdownDisplay(targetMs);

      const targetDisplay = new Date(targetMs).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric", timeZone: "Asia/Kolkata" });

      grid.appendChild(el("div", { class: `cd-card${passed ? " passed" : ""}`, id: `cd-card-${c.id}`, style: `border-color:${accent}` }, [
        el("button", { class: "cd-remove-btn", text: "\u00d7", "aria-label": "Remove countdown", onclick: () => removeCountdown(c.id) }),
        el("div", { class: "cd-card-label", title: c.label, text: c.label }),
        el("div", { class: "cd-card-date", text: targetDisplay }),
        el("div", { class: "cd-card-big pixel", id: `cd-big-${c.id}`, style: `color:${accent}`, text: bigText }),
        el("div", { class: "cd-card-sub", id: `cd-sub-${c.id}`, text: subText }),
      ]));
    });
    cdSection.appendChild(grid);
  }

  wrap.appendChild(cdSection);
  return wrap;
}

// Live clock + countdown ticker: updates just the relevant text nodes directly
// instead of calling the full render() every second, so it never disturbs
// whatever you're typing in the add-countdown inputs.
function tickDashboard() {
  if (state.nav.level !== "dashboard") return;
  const clockEl = document.getElementById("dash-clock");
  if (clockEl) clockEl.textContent = getISTTimeString();
  const dateEl = document.getElementById("dash-date");
  if (dateEl) dateEl.textContent = getISTDateString();

  state.countdowns.forEach((c) => {
    const bigEl = document.getElementById(`cd-big-${c.id}`);
    const subEl = document.getElementById(`cd-sub-${c.id}`);
    const cardEl = document.getElementById(`cd-card-${c.id}`);
    if (!bigEl || !subEl) return;
    const { bigText, subText, passed } = computeCountdownDisplay(countdownTargetMs(c.targetDate));
    bigEl.textContent = bigText;
    subEl.textContent = subText;
    if (cardEl) cardEl.classList.toggle("passed", passed);
  });
}
setInterval(tickDashboard, 1000);

/* ================= command palette (press F) =================
   Lives outside #app and manages its own DOM, so the app's render() never
   rebuilds it mid-keystroke and steals the caret. */
let paletteEl = null;
let paletteResults = [];
let paletteIndex = 0;

function paletteCommands() {
  return [
    { label: "Dashboard", meta: "GO", accent: "#F2F2F2", run: goLanding },
    { label: "Subjects", meta: "GO", accent: "#F2F2F2", run: goHome },
    { label: "Heatmap", meta: "GO", accent: "#F2F2F2", run: goHeatmap },
    { label: "Calendar", meta: "GO", accent: "#F2F2F2", run: goCalendar },
    { label: "Stats", meta: "GO", accent: "#F2F2F2", run: goStats },
    { label: "Timer", meta: "GO", accent: "#F2F2F2", run: goTimer },
    { label: "Export backup", meta: "ACTION", accent: "var(--chemistry)", run: exportProgress },
    { label: "Toggle revision mode", meta: "ACTION", accent: "var(--chemistry)", run: toggleRevisionMode },
  ];
}
function paletteChapters() {
  const out = [];
  SUBJECTS.forEach((s) => CURRICULUM[s].forEach((mod, mi) => mod.chapters.forEach((c, ci) => {
    const m = mi + 1, cIdx = ci + 1;
    const agg = chapterAgg(state.progress, s, m, cIdx);
    out.push({
      label: c.name,
      meta: `${s.slice(0, 4).toUpperCase()} M${m} \u00b7 ${pct(agg.done, agg.total)}%`,
      accent: THEME[s].accent,
      searchText: `${c.name} ${s} m${m}`,
      run: () => goChapter(s, m, cIdx),
    });
  })));
  return out;
}
// Subsequence match: typing "quadeq" finds "Quadratic Equations". Consecutive
// hits and a match at the very start score higher, so exact prefixes float up.
function fuzzyScore(query, text) {
  const q = query.toLowerCase().replace(/\s+/g, "");
  const t = text.toLowerCase();
  if (!q) return 0;
  let qi = 0, score = 0, streak = 0;
  for (let i = 0; i < t.length && qi < q.length; i++) {
    if (t[i] === q[qi]) {
      qi += 1; streak += 1;
      score += 2 + streak + (i === 0 ? 8 : 0);
    } else streak = 0;
  }
  return qi === q.length ? score : -1;
}
function computePaletteResults(query) {
  const trimmed = query.trim().toLowerCase();
  if (trimmed === "debug") {
    return [{ label: "\u26A0\uFE0F RUN SYSTEM BOOT", meta: "???", accent: "#F2C94C", run: playBootSequence }];
  }
  const pool = [...paletteChapters(), ...paletteCommands()];
  if (!trimmed) return paletteCommands();
  return pool
    .map((item) => ({ item, score: fuzzyScore(query, item.searchText || item.label) }))
    .filter((r) => r.score >= 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 12)
    .map((r) => r.item);
}
function openPalette() {
  if (paletteEl) return;
  paletteIndex = 0;

  const input = el("input", { class: "cmdk-input", type: "text", placeholder: "Search chapters, jump anywhere\u2026" });
  const list = el("div", { class: "cmdk-list" });
  const box = el("div", { class: "cmdk-box" }, [
    input,
    el("div", { class: "cmdk-hint", text: "\u2191\u2193 MOVE \u00b7 ENTER OPEN \u00b7 ESC CLOSE" }),
    list,
  ]);
  box.addEventListener("click", (e) => e.stopPropagation());

  const overlay = el("div", { class: "cmdk-overlay", onclick: closePalette }, [box]);

  const paint = () => {
    list.innerHTML = "";
    if (paletteResults.length === 0) {
      list.appendChild(el("div", { class: "cmdk-empty", text: "No matches." }));
      return;
    }
    paletteResults.forEach((item, i) => {
      list.appendChild(el("button", {
        class: i === paletteIndex ? "cmdk-item active" : "cmdk-item",
        onclick: () => { closePalette(); item.run(); },
      }, [
        el("span", { class: "cmdk-dot", style: `background:${item.accent}` }),
        el("span", { class: "cmdk-label", text: item.label }),
        el("span", { class: "cmdk-meta", text: item.meta }),
      ]));
    });
    const active = list.children[paletteIndex];
    if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest" });
  };

  const refresh = () => { paletteResults = computePaletteResults(input.value); paletteIndex = 0; paint(); };

  input.addEventListener("input", refresh);
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); paletteIndex = Math.min(paletteResults.length - 1, paletteIndex + 1); paint(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); paletteIndex = Math.max(0, paletteIndex - 1); paint(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const chosen = paletteResults[paletteIndex];
      if (chosen) { closePalette(); chosen.run(); }
    } else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  });

  document.body.appendChild(overlay);
  paletteEl = overlay;
  refresh();
  input.focus();
}
function closePalette() {
  if (!paletteEl) return;
  paletteEl.remove();
  paletteEl = null;
  paletteResults = [];
}

/* ================= easter eggs ================= */

// Click the header title 7x while already on the dashboard -> confetti.
// Resets if you pause too long between clicks, or click it from another page.
let titleClickCount = 0;
let titleClickResetTimer = null;
function handleTitleClick() {
  if (state.nav.level === "dashboard") {
    titleClickCount += 1;
    clearTimeout(titleClickResetTimer);
    titleClickResetTimer = setTimeout(() => { titleClickCount = 0; }, 2000);
    if (titleClickCount >= 7) {
      titleClickCount = 0;
      clearTimeout(titleClickResetTimer);
      launchConfetti();
    }
  } else {
    titleClickCount = 0;
  }
  goLanding();
}

const CONFETTI_COLORS = ["#4CDE6E", "#FF5A36", "#38B6FF", "#F2C94C", "#F2F2F2"];
function launchConfetti() {
  const count = 90;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const size = 6 + Math.random() * 6;
    const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    const left = Math.random() * 100;
    const duration = 2.2 + Math.random() * 1.6;
    const delay = Math.random() * 0.35;
    const endRotate = 360 + Math.random() * 720;
    const drift = (Math.random() - 0.5) * 160;
    piece.style.left = `${left}vw`;
    piece.style.width = `${size}px`;
    piece.style.height = `${size * 1.6}px`;
    piece.style.background = color;
    piece.style.setProperty("--end-rotate", `${endRotate}deg`);
    piece.style.setProperty("--drift", `${drift}px`);
    piece.style.animationDuration = `${duration}s`;
    piece.style.animationDelay = `${delay}s`;
    piece.addEventListener("animationend", () => piece.remove());
    document.body.appendChild(piece);
  }
}

// Typing "debug" into FIND surfaces a hidden command that plays a fake CRT boot log.
const BOOT_LINES = [
  "BT-TERMINAL BIOS v1.0",
  "INITIALIZING MODULE LOG...",
  "CHECKING LOCALSTORAGE... OK",
  "LOADING CURRICULUM... OK",
  "SYNCING PROGRESS... OK",
  "MOUNTING NOTES PARTITION... OK",
  "CALIBRATING PACE \u0026 PROJECTION...",
  "SCANNING FOR BUGS...",
  "NONE FOUND (that we'll admit to)",
  "WELCOME BACK, OPERATOR.",
];
function playBootSequence() {
  const overlay = el("div", { class: "boot-overlay" });
  const skip = () => {
    overlay.remove();
    document.removeEventListener("keydown", onKeyDuringBoot);
  };
  const onKeyDuringBoot = () => skip();
  overlay.addEventListener("click", skip);
  document.addEventListener("keydown", onKeyDuringBoot);
  document.body.appendChild(overlay);

  let i = 0;
  const next = () => {
    if (i >= BOOT_LINES.length) {
      overlay.appendChild(el("span", { class: "boot-cursor" }));
      setTimeout(skip, 900);
      return;
    }
    overlay.appendChild(el("div", { class: "boot-line", text: BOOT_LINES[i] }));
    i += 1;
    setTimeout(next, 220);
  };
  next();
}

// Up-Down-Left-Right -> opens a hidden Snake game.
// Buffered against a rolling keydown window; ignored while typing, mid-search, or already playing.
const KONAMI_SEQUENCE = ["arrowup", "arrowdown", "arrowleft", "arrowright"];
let konamiBuffer = [];
function checkKonami(e) {
  if (paletteEl || snakeOverlayEl) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (isTypingTarget(e.target)) return;
  const key = e.key.toLowerCase();
  konamiBuffer.push(key);
  if (konamiBuffer.length > KONAMI_SEQUENCE.length) konamiBuffer.shift();
  if (konamiBuffer.length === KONAMI_SEQUENCE.length && konamiBuffer.every((k, i) => k === KONAMI_SEQUENCE[i])) {
    konamiBuffer = [];
    openSnakeGame();
  }
}
document.addEventListener("keydown", checkKonami);

/* ---------------- hidden Snake game (\u2191\u2193\u2190\u2192) ---------------- */
let snakeOverlayEl = null;
let snakeCleanup = null;
function openSnakeGame() {
  if (snakeOverlayEl) return;
  const cell = 16, cols = 20, rows = 20;

  const canvas = document.createElement("canvas");
  canvas.width = cols * cell;
  canvas.height = rows * cell;
  canvas.className = "snake-canvas";
  const ctx = canvas.getContext("2d");

  const scoreEl = el("div", { class: "snake-score pixel", text: "SCORE: 0" });
  const closeBtn = el("button", { class: "snake-close", text: "\u00d7", "aria-label": "Close game", onclick: closeSnakeGame });
  const box = el("div", { class: "snake-box" }, [
    el("div", { class: "snake-top" }, [
      el("span", { class: "snake-title pixel", text: "\uD83D\uDC0D SECRET SNAKE" }),
      closeBtn,
    ]),
    canvas,
    el("div", { class: "snake-bottom" }, [scoreEl, el("div", { class: "snake-hint", text: "ARROWS MOVE \u00b7 ESC CLOSE" })]),
  ]);
  box.addEventListener("click", (e) => e.stopPropagation());
  const overlay = el("div", { class: "game-overlay", onclick: closeSnakeGame }, [box]);
  document.body.appendChild(overlay);
  snakeOverlayEl = overlay;

  let snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  let dir = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let score = 0;
  let gameOver = false;

  function randomFood() {
    let p;
    do { p = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) }; }
    while (snake.some((s) => s.x === p.x && s.y === p.y));
    return p;
  }
  let food = randomFood();

  function draw() {
    ctx.fillStyle = "#17181A";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#FF5A36";
    ctx.fillRect(food.x * cell, food.y * cell, cell - 2, cell - 2);
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#4CDE6E" : "#38B6FF";
      ctx.fillRect(s.x * cell, s.y * cell, cell - 2, cell - 2);
    });
    if (gameOver) {
      ctx.fillStyle = "rgba(0,0,0,0.68)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.font = "14px 'Press Start 2P', monospace";
      ctx.fillStyle = "#000000";
      ctx.fillText("GAME OVER", canvas.width / 2 + 2, canvas.height / 2 - 8 + 2);
      ctx.fillStyle = "#FF5A36";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 8);

      ctx.font = "18px 'VT323', monospace";
      ctx.fillStyle = "#EDEDED";
      ctx.fillText("press R to restart", canvas.width / 2, canvas.height / 2 + 24);
    }
  }

  function tick() {
    if (gameOver) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows;
    const hitSelf = snake.some((s) => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) { gameOver = true; draw(); return; }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = `SCORE: ${score}`;
      food = randomFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function restart() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
    food = randomFood();
    score = 0; gameOver = false;
    scoreEl.textContent = "SCORE: 0";
    draw();
  }

  function onKey(e) {
    const k = e.key.toLowerCase();
    if (k === "escape") { closeSnakeGame(); return; }
    if (gameOver) { if (k === "r") restart(); return; }
    if (k === "arrowup" && dir.y === 0) nextDir = { x: 0, y: -1 };
    else if (k === "arrowdown" && dir.y === 0) nextDir = { x: 0, y: 1 };
    else if (k === "arrowleft" && dir.x === 0) nextDir = { x: -1, y: 0 };
    else if (k === "arrowright" && dir.x === 0) nextDir = { x: 1, y: 0 };
    else return;
    e.preventDefault();
  }

  document.addEventListener("keydown", onKey);
  const interval = setInterval(tick, 120);
  draw();

  snakeCleanup = () => {
    clearInterval(interval);
    document.removeEventListener("keydown", onKey);
  };
}
function closeSnakeGame() {
  if (!snakeOverlayEl) return;
  if (snakeCleanup) snakeCleanup();
  snakeCleanup = null;
  snakeOverlayEl.remove();
  snakeOverlayEl = null;
}

/* ---------------- F opens the palette (only when not typing) ---------------- */
function isTypingTarget(node) {
  if (!node) return false;
  const tag = node.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || node.isContentEditable;
}
document.addEventListener("keydown", (e) => {
  if (paletteEl) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (isTypingTarget(e.target)) return;
  if (e.key.toLowerCase() === "f") { e.preventDefault(); openPalette(); }
});

render();
</script>
